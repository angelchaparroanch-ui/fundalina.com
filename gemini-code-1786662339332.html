<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundalina - Tienda Oficial</title>
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #2f3542;
            --bg-color: #f1f2f6;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--secondary);
            line-height: 1.6;
        }

        header {
            background-color: var(--white);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero {
            background: linear-gradient(135deg, var(--secondary), #1e272e);
            color: var(--white);
            text-align: center;
            padding: 80px 20px;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            color: #dfe4ea;
            margin-bottom: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 28px;
            margin-bottom: 20px;
            text-align: center;
            color: var(--secondary);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-img {
            width: 100%;
            height: 200px;
            background-color: #ced6e0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #747d8c;
            font-weight: bold;
        }

        .product-info {
            padding: 20px;
        }

        .product-title {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 22px;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .btn {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #ff6b81;
        }

        /* Modal de Compra */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--white);
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 22px;
            cursor: pointer;
            color: #747d8c;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced6e0;
            border-radius: 6px;
            font-size: 14px;
        }

        footer {
            background-color: var(--secondary);
            color: var(--white);
            text-align: center;
            padding: 30px;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Fundalina</div>
    </header>

    <section class="hero">
        <h1>Bienvenidos a Fundalina</h1>
        <p>Los mejores productos exclusivos directamente en tus manos.</p>
    </section>

    <div class="container">
        <h2 class="section-title">Nuestros Productos</h2>
        <div class="products-grid" id="product-list">
            <!-- Los productos se cargan dinámicamente o se pueden duplicar aquí -->
            <div class="product-card">
                <div class="product-img">Imagen del Producto</div>
                <div class="product-info">
                    <h3 class="product-title">Producto Estrella Fundalina</h3>
                    <p class="product-price">$49.99</p>
                    <button class="btn" onclick="openCheckout('Producto Estrella Fundalina', '49.99')">Comprar Ahora</button>
                </div>
            </div>

            <div class="product-card">
                <div class="product-img">Imagen del Producto</div>
                <div class="product-info">
                    <h3 class="product-title">Edición Especial</h3>
                    <p class="product-price">$79.99</p>
                    <button class="btn" onclick="openCheckout('Edición Especial', '79.99')">Comprar Ahora</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Formulario de Pedido -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCheckout()">&times;</span>
            <h2 style="margin-bottom: 20px;">Finalizar Pedido</h2>
            <p id="selectedProduct" style="margin-bottom: 15px; font-weight: bold; color: var(--primary);"></p>
            
            <form id="orderForm" onsubmit="submitOrder(event)">
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono / WhatsApp:</label>
                    <input type="tel" id="telefono" required placeholder="Ej. +57 300 1234567">
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección de Envío:</label>
                    <textarea id="direccion" rows="2" required placeholder="Calle, número, barrio, ciudad"></textarea>
                </div>

                <div class="form-group">
                    <label for="detalles">Especificaciones (Color, Talla, etc.):</label>
                    <textarea id="detalles" rows="2" placeholder="Indica detalles clave del objeto"></textarea>
                </div>

                <div class="form-group">
                    <label for="pago">Método de Pago:</label>
                    <select id="pago">
                        <option value="Contra Entrega">Pago Contra Entrega</option>
                        <option value="Transferencia Bancaria">Transferencia Bancaria</option>
                    </select>
                </div>

                <button type="submit" class="btn">Confirmar Pedido</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Fundalina. Todos los derechos reservados.</p>
    </footer>

    <script>
        let currentProduct = "";
        let currentPrice = "";

        function openCheckout(product, price) {
            currentProduct = product;
            currentPrice = price;
            document.getElementById('selectedProduct').innerText = `Producto: ${product} - $${price}`;
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').style.display = 'none';
        }

        function submitOrder(event) {
            event.preventDefault();
            
            const nombre = document.getElementById('nombre').value;
            const telefono = document.getElementById('telefono').value;
            const direccion = document.getElementById('direccion').value;
            const detalles = document.getElementById('detalles').value;
            const pago = document.getElementById('pago').value;

            // Creamos un mensaje para enviar los datos por WhatsApp o procesarlos
            const mensaje = `¡Hola! Nuevo pedido en Fundalina:%0A%0A*Producto:* ${currentProduct} ($${currentPrice})%0A*Nombre:* ${nombre}%0A*Teléfono:* ${telefono}%0A*Dirección:* ${direccion}%0A*Detalles:* ${detalles || 'Ninguno'}%0A*Pago:* ${pago}`;
            
            // Reemplaza el número de teléfono con el tuyo para recibir los pedidos directo a tu WhatsApp
            const tuNumeroWhatsApp = "573000000000"; 
            
            window.open(`https://wa.me/${tuNumeroWhatsApp}?text=${mensaje}`, '_blank');
            
            closeCheckout();
            alert("¡Pedido registrado con éxito! Te redirigiremos para finalizar.");
        }
    </script>
</body>
</html>
